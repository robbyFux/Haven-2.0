[project]
name = "haven-cloud"
version = "1.0.0"
description = "Haven 2.0 self-hosted cloud backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.135.3",
    "pydantic==2.12.5",
    "pydantic-settings",
    "sqlalchemy[asyncio]==2.0.49",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "celery[redis]==5.6.3",
    "uvicorn[standard]==0.44.0",
    "gunicorn==25.3.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "argon2-cffi==25.1.0",
    "cryptography",
    "pyotp==2.9.0",
    "qrcode[pil]==8.2",
    "pillow==12.2.0",
    "aiosmtplib==5.1.0",
    "aiofiles==25.1.0",
    "httpx==0.28.1",
    "python-multipart",
]

[project.optional-dependencies]
ml = [
    "ai-edge-litert==2.1.3",
]
web = [
    "django>=5.2,<5.3",
    "django-tailwind-cli==4.5.1",
    "django-htmx==1.27.0",
    "django-filter==25.2",
    "whitenoise==6.12.0",
    "psycopg2-binary==2.9.11",
]
dev = [
    "pytest",
    "pytest-asyncio>=1.0",
    "httpx",
    "aiosqlite",
    "pytest-django==4.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
