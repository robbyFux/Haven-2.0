{% if devices %}
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b border-gray-700">
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Name</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">App-Key</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Status</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Last Seen</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Created</th>
          <th class="px-4 py-3 text-xs font-medium text-gray-400 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-700">
        {% for device in devices %}
          {% include "devices/partials/device_row.html" %}
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <div class="text-center py-12 text-gray-500">
    <p class="text-lg">No devices yet.</p>
    <p class="text-sm mt-1">Add your first device using the form above.</p>
  </div>
{% endif %}
